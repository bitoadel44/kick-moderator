name = "kick-moderator"
main = "src/index.js"
compatibility_date = "2026-11-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kick-moderator-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APP_NAME = "K_Botros Kick Moderator"
